services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ascento-dev
    image: ascento-dev:local
    working_dir: /workspace
    gpus: all
    environment: &ascento-environment
      ASCENTO_JAX_PLATFORM: cuda
      JAX_PLATFORMS: cuda
      MUJOCO_GL: egl
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      ASCENTO_ARTIFACT_ROOT: /artifacts/runs
      PYTHONPATH: /workspace
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/workspace
      - ./docker-data/artifacts:/artifacts
    stdin_open: true
    tty: true

  trainer:
    image: ascento-dev:local
    working_dir: /workspace
    init: true
    gpus: all
    environment: *ascento-environment
    volumes:
      - .:/workspace
      - ./docker-data/artifacts:/artifacts
    command:
      - python
      - -m
      - dashboard.launch
      - --artifact-root
      - /artifacts/runs
      - --
      - --stage
      - balance

  dashboard:
    image: ascento-dev:local
    working_dir: /workspace
    init: true
    gpus: all
    environment:
      <<: *ascento-environment
      ASCENTO_DASHBOARD_DIST: /opt/ascento-dashboard-dist
    volumes:
      - .:/workspace
      - ./docker-data/artifacts:/artifacts
    ports:
      - "127.0.0.1:8000:8000"
    command:
      - python
      - -m
      - uvicorn
      - dashboard.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
