name: Dashboard CI

on:
  pull_request:
    paths:
      - 'dashboard/**'
      - 'src/ascento_mjlab/tools/**'
      - 'tests_mjlab/**'
      - 'tests_dashboard/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/dashboard-ci.yml'
  push:
    paths:
      - 'dashboard/**'
      - 'src/ascento_mjlab/tools/**'
      - 'tests_mjlab/**'
      - 'tests_dashboard/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/dashboard-ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # mjlab defaults to EGL on Linux, but GitHub-hosted runners do not
      # provide a usable EGL runtime. These tests do not render, so disable
      # MuJoCo's GL backend explicitly, matching mjlab's own CI smoke tests.
      MUJOCO_GL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen --extra cpu pytest -q tests_mjlab

  dashboard-backend:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen --extra cpu --extra dashboard pytest -q tests_dashboard

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
