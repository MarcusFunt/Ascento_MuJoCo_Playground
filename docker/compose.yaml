services:
  dashboard-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ascento
      POSTGRES_USER: ascento
      POSTGRES_PASSWORD: ${ASCENTO_DB_PASSWORD:-ascento-local}
    volumes:
      - dashboard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascento -d ascento"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  ascento-mjlab:
    image: ascento-mjlab:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        COMPUTE_EXTRA: ${ASCENTO_COMPUTE_EXTRA:-cpu}
        REPOSITORY_COMMIT: ${ASCENTO_REPOSITORY_COMMIT:-unknown}
        REPOSITORY_BRANCH: ${ASCENTO_REPOSITORY_BRANCH:-unknown}
        REPOSITORY_DIRTY: ${ASCENTO_REPOSITORY_DIRTY:-unknown}
    volumes:
      # The CLI/smoke container sees the same canonical WSL source and Git
      # metadata as the Dashboard; it must not execute an image-only checkout.
      - ../.git:/workspace/.git:ro
      - ../src:/workspace/src:ro
      - ../dashboard:/workspace/dashboard:ro
      - ../scripts:/workspace/scripts:ro
      - ../config:/workspace/config:ro
      - ../benchmarks:/workspace/benchmarks:ro
      - ../docs/experiments:/workspace/docs/experiments:ro
      - ../logs:/workspace/logs
      - ../checkpoints:/workspace/checkpoints
      - ../captures:/workspace/captures
      - ../evaluations:/workspace/evaluations
      - ../.maintenance/repository-version.json:/etc/ascento/repository-version.json:ro
    environment:
      MUJOCO_GL: ${ASCENTO_MUJOCO_GL:-disable}
      GIT_OPTIONAL_LOCKS: "0"
      ASCENTO_RUNTIME_KIND: packaged-docker
      ASCENTO_CANONICAL_SOURCE_ROOT: ${ASCENTO_CANONICAL_SOURCE_ROOT:-/root/Ascento_MuJoCo_Playground}
      ASCENTO_CANONICAL_VERSION_FILE: /etc/ascento/repository-version.json
      ASCENTO_COMPUTE_EXTRA: ${ASCENTO_COMPUTE_EXTRA:-cpu}

  dashboard:
    image: ascento-mjlab:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        COMPUTE_EXTRA: ${ASCENTO_COMPUTE_EXTRA:-cpu}
        REPOSITORY_COMMIT: ${ASCENTO_REPOSITORY_COMMIT:-unknown}
        REPOSITORY_BRANCH: ${ASCENTO_REPOSITORY_BRANCH:-unknown}
        REPOSITORY_DIRTY: ${ASCENTO_REPOSITORY_DIRTY:-unknown}
    command: ["python", "-m", "uvicorn", "dashboard.app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      dashboard-db:
        # The web UI must still start if the optional semantic index is broken.
        # The app retries the connection briefly, then falls back to filesystem state.
        condition: service_started
    ports:
      - "${ASCENTO_DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${ASCENTO_DASHBOARD_PORT:-8000}:8000"
      - "127.0.0.1:${ASCENTO_VIEWER_PORT:-8081}:${ASCENTO_VIEWER_PORT:-8081}"
    volumes:
      # The runtime uses the one canonical WSL source tree read-only. The image
      # supplies dependencies and the built frontend; it is not another checkout.
      - ../.git:/workspace/.git:ro
      - ../src:/workspace/src:ro
      - ../dashboard:/workspace/dashboard:ro
      - ../scripts:/workspace/scripts:ro
      - ../config:/workspace/config:ro
      - ../benchmarks:/workspace/benchmarks:ro
      - ../docs/experiments:/workspace/docs/experiments:ro
      # Run management writes launcher metadata, logs and checkpoints beneath
      # the shared artifact root. Other repository artifacts stay read-only.
      - ../logs:/workspace/logs
      - ../checkpoints:/workspace/checkpoints:ro
      - ../captures:/workspace/captures:ro
      - ../evaluations:/workspace/evaluations:ro
      # This is the only host-control surface exposed to the web container.
      # It is a fixed-operation Unix socket, not Docker's control socket.
      - /run/ascento-supervisor:/run/ascento-supervisor
      - ../.maintenance/repository-version.json:/etc/ascento/repository-version.json:ro
    environment:
      MUJOCO_GL: ${ASCENTO_MUJOCO_GL:-disable}
      GIT_OPTIONAL_LOCKS: "0"
      ASCENTO_ARTIFACT_ROOT: /workspace/logs/rsl_rl
      ASCENTO_DATABASE_URL: postgresql+psycopg://ascento:${ASCENTO_DB_PASSWORD:-ascento-local}@dashboard-db:5432/ascento
      ASCENTO_VIEWER_PORT: ${ASCENTO_VIEWER_PORT:-8081}
      ASCENTO_SUPERVISOR_SOCKET: /run/ascento-supervisor/supervisor.sock
      ASCENTO_RUNTIME_KIND: packaged-docker
      ASCENTO_CANONICAL_SOURCE_ROOT: ${ASCENTO_CANONICAL_SOURCE_ROOT:-/root/Ascento_MuJoCo_Playground}
      ASCENTO_CANONICAL_VERSION_FILE: /etc/ascento/repository-version.json
      ASCENTO_COMPUTE_EXTRA: ${ASCENTO_COMPUTE_EXTRA:-cpu}
      ASCENTO_CONTROL_TOKEN: ${ASCENTO_CONTROL_TOKEN:-}
    restart: unless-stopped


volumes:
  dashboard-postgres-data:
