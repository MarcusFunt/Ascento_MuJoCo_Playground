[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[project]
name = "ascento-mjlab"
version = "0.1.0"
description = "Ascento motion authoring environments built on mjlab and MuJoCo Warp."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mjlab==1.6.0",
]

[project.optional-dependencies]
cu128 = ["torch>=2.7.0"]
cpu = ["torch>=2.7.0"]
dashboard = ["fastapi==0.141.1", "uvicorn[standard]==0.52.4"]

[project.scripts]
clip-motion = "ascento_mjlab.tools.clip_motion:main"
rank-motion = "ascento_mjlab.tools.motion_quality:main"
ascento-evaluate = "ascento_mjlab.evaluation.cli:main"
ascento-evaluate-checkpoints = "ascento_mjlab.evaluation.checkpoints:main"
ascento-compare-evaluations = "ascento_mjlab.evaluation.compare:main"
ascento-replay-eval = "ascento_mjlab.evaluation.replay:main"

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.16.1",
]

[tool.uv]
conflicts = [
  [{extra = "cu128"}, {extra = "cpu"}],
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
torch = [
  { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
]

[project.entry-points."mjlab.tasks"]
ascento_mjlab = "ascento_mjlab.tasks"

[tool.pytest.ini_options]
testpaths = ["tests_mjlab"]
markers = [
  "gpu: requires a CUDA-capable device",
  "slow: long-running integration test",
]
addopts = "--strict-markers"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
