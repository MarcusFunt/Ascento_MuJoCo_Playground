# Small fixed pre-promotion ladder: prove a quiet hold, straight travel, a
# heading change, and a short waypoint before spending time on the full gate.
[[families]]
id = "balance_10s"
kind = "command_timeline"
count = 1
horizon_s = 10.0
commands = [{ time_s = 0.0, name = "world_target_pose", values = [0.0, 0.0, 0.0] }]
[families.reset]

[[families]]
id = "straight_050m"
kind = "command_timeline"
count = 1
horizon_s = 6.0
