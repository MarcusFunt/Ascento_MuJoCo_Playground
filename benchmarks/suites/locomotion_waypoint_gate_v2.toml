wy = [-0.10, 0.10]
wz = [-0.10, 0.10]
[families.disturbance]
start_s = 30.0
duration_s = 0.10
directions = ["+x", "-x", "+y", "-y"]
equivalent_delta_v = [0.05, 0.10, 0.15]

# Hard stop limits are purpose-built for the last two seconds after a waypoint
# command. The 0.10 high-frequency ratio matches the quiet-quality numerical
# limit but samples a different window; run that suite separately as well.
# Action-rate 0.05 and second-difference 0.18 are stop-window limits in raw
# policy action units. Wilson lower limits are deliberately practical for 48
# fixed-seed scenarios per family: all-success gives about 0.926.

[[gates]]
id = "near_push_015_survival"
family = "near_push_015"
metric = "success"
statistic = "wilson_lower"
op = ">="
threshold = 0.85

[[gates]]
id = "near_push_015_all_waypoints_dwelled"
family = "near_push_015"
metric = "waypoint_sequence_complete"
statistic = "wilson_lower"
