schema_version = 1
suite_id = "locomotion_waypoint_gate_v2"
task = "Ascento-Locomotion-Flat"
root_seed = 601773
policy_mode = "deterministic"
required_capabilities = ["locomotion", "exact_reset", "force_disturbance", "deterministic_policy", "command:world_target_pose", "waypoint_dwell"]

# A frozen simulation navigation contract. Coordinates are absolute in each
# clone's flat world-map frame (relative to its env origin); yaw is world yaw.
# The near case retains v1's 4 s push, 9 s command, and 20 s horizon.
# A waypoint only completes after 0.75 s continuously inside the evaluator's
# position/heading/speed/balance/contact envelope. The final waypoint must
# still satisfy that envelope for 1 s at the horizon. The last 2 s are a
# separately measured stop window; a single radius crossing cannot pass.

[[families]]
id = "near_push_015"
kind = "disturbance"
count = 48
horizon_s = 20.0
commands = [
  { time_s = 9.0, name = "world_target_pose", values = [0.15, 0.0, 0.0] },
]
[families.reset]
roll = [-0.08, 0.08]
pitch = [-0.08, 0.08]
yaw = [-0.25, 0.25]
vx = [-0.05, 0.05]
vy = [-0.05, 0.05]
vz = [-0.05, 0.05]
wx = [-0.10, 0.10]
wy = [-0.10, 0.10]
wz = [-0.10, 0.10]
[families.disturbance]
start_s = 4.0
duration_s = 0.10
directions = ["+x", "-x", "+y", "-y"]
equivalent_delta_v = [0.05, 0.10, 0.15]

[[families]]
id = "one_meter"
kind = "command_timeline"
count = 48
horizon_s = 30.0
commands = [
  { time_s = 3.0, name = "world_target_pose", values = [1.0, 0.0, 0.0] },
]
[families.reset]
roll = [-0.08, 0.08]
pitch = [-0.08, 0.08]
yaw = [-3.141592653589793, 3.141592653589793]
vx = [-0.05, 0.05]
vy = [-0.05, 0.05]
vz = [-0.05, 0.05]
wx = [-0.10, 0.10]
wy = [-0.10, 0.10]
wz = [-0.10, 0.10]

