wy = [-0.10, 0.10]
wz = [-0.10, 0.10]

[[families]]
id = "route_recovery"
kind = "disturbance"
count = 64
horizon_s = 55.0
commands = [
  { time_s = 0.0, name = "world_target_pose", values = [2.0, 0.0, 0.000000000000000] },
  { time_s = 17.0, name = "world_target_pose", values = [2.0, 2.0, 1.570796326794897] },
  { time_s = 34.0, name = "world_target_pose", values = [0.0, 2.0, 3.141592653589793] },
]
[families.reset]
roll = [-0.08, 0.08]
pitch = [-0.08, 0.08]
yaw = [-3.141592653589793, 3.141592653589793]
vx = [-0.05, 0.05]
vy = [-0.05, 0.05]
vz = [-0.05, 0.05]
wx = [-0.10, 0.10]
wy = [-0.10, 0.10]
wz = [-0.10, 0.10]

[families.disturbance]
start_s = 30.0
duration_s = 0.10
directions = ["+x", "-x", "+y", "-y"]
equivalent_delta_v = [0.05, 0.10, 0.15]

