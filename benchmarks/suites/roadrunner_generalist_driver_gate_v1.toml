  { time_s = 17.0, name = "world_target_pose", values = [2.0, 2.0, 1.570796326794897] },
  { time_s = 34.0, name = "world_target_pose", values = [0.0, 2.0, 3.141592653589793] },
]
[families.reset]
roll = [-0.08, 0.08]
