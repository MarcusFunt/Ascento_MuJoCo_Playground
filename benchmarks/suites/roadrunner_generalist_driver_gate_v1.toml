schema_version = 1
suite_id = "roadrunner_generalist_driver_gate_v1"
task = "Ascento-Generalist-Locomotion-Flat"
root_seed = 20261010
policy_mode = "deterministic"
required_capabilities = ["locomotion", "exact_reset", "force_disturbance", "deterministic_policy", "command:world_target_pose", "waypoint_dwell"]

# 256 fixed scenarios across direct 2-3 m navigation, a 90-degree endpoint turn,
# a three-waypoint turning route, and the same route with a recovery push.
# The first target is assigned at step zero, replacing the reset helper's short target.
# Each waypoint requires a 0.75 s physical dwell; the final stop must hold 1 s.
# Final target and stop-window error must stay within the practical 5 cm limit.

[[families]]
id = "forward_2m"
kind = "command_timeline"
count = 64
horizon_s = 35.0
commands = [
  { time_s = 0.0, name = "world_target_pose", values = [2.0, 0.0, 0.000000000000000] },
]
[families.reset]
roll = [-0.08, 0.08]
pitch = [-0.08, 0.08]
yaw = [-3.141592653589793, 3.141592653589793]
vx = [-0.05, 0.05]
vy = [-0.05, 0.05]
vz = [-0.05, 0.05]
wx = [-0.10, 0.10]
wy = [-0.10, 0.10]
wz = [-0.10, 0.10]

[[families]]
id = "turn_3m"
kind = "command_timeline"
count = 64
horizon_s = 50.0
commands = [
  { time_s = 0.0, name = "world_target_pose", values = [3.0, 0.0, 1.570796326794897] },
]
[families.reset]
roll = [-0.08, 0.08]
pitch = [-0.08, 0.08]
yaw = [-3.141592653589793, 3.141592653589793]
vx = [-0.05, 0.05]
