schema_version = 1
suite_id = "locomotion_speed_command_gate_v1"
task = "Ascento-Locomotion-Speed-Flat"
root_seed = 531904
policy_mode = "deterministic"
required_capabilities = ["locomotion", "exact_reset", "deterministic_policy", "command:speed", "speed_tracking"]

# Command levels are fractions of the run's recorded maximum speed, so this
# immutable gate exercises the full range for every managed speed-conditioned run.
[[families]]
id = "runtime_speed_sweep"
kind = "command_timeline"
count = 256
horizon_s = 24.0
commands = [
  { time_s = 0.0, name = "world_target_offset", values = [8.0, 0.0, 0.0] },
  { time_s = 1.0, name = "speed_fraction", values = [0.25] },
  { time_s = 7.0, name = "speed_fraction", values = [0.70] },
  { time_s = 15.0, name = "speed_fraction", values = [0.0] },
]
[families.reset]
roll = [-0.08, 0.08]
pitch = [-0.08, 0.08]
yaw = [-3.141592653589793, 3.141592653589793]
vx = [-0.05, 0.05]
vy = [-0.05, 0.05]

vz = [-0.05, 0.05]
wx = [-0.10, 0.10]
wy = [-0.10, 0.10]
wz = [-0.10, 0.10]

[[gates]]
id = "speed_policy_survival_lcb"
family = "runtime_speed_sweep"
metric = "success"
statistic = "wilson_lower"
op = ">="
threshold = 0.90

[[gates]]
id = "speed_tracking_fraction_p95"
family = "runtime_speed_sweep"
metric = "speed_tracking_rmse_fraction"
statistic = "p95"
op = "<="
threshold = 0.20

[[gates]]
id = "controlled_stop_speed_p95"
family = "runtime_speed_sweep"
metric = "zero_command_speed_rms_mps"
statistic = "p95"
op = "<="
threshold = 0.15
