schema_version = 1
suite_id = "roadrunner_generalist_sequence_promotion_v1"
task = "Ascento-Generalist-Locomotion-Flat"
root_seed = 2026100701
policy_mode = "deterministic"
required_capabilities = ["locomotion", "exact_reset", "force_disturbance", "deterministic_policy"]

# Held-out promotion suite: identical task/gate semantics to the development
# suite, with an independently seeded scenario set. Evaluate only the final
# selected checkpoint; do not use this suite for routine screening.
[[families]]
id = "sequence"
kind = "disturbance"
count = 256
horizon_s = 20.0
commands = [
  { time_s = 9.0, name = "world_target_offset", values = [0.15, 0.0, 0.0] },
]
[families.reset]
roll = [-0.08, 0.08]
pitch = [-0.08, 0.08]
yaw = [-3.141592653589793, 3.141592653589793]
vx = [-0.05, 0.05]
vy = [-0.05, 0.05]
vz = [-0.05, 0.05]
wx = [-0.10, 0.10]
wy = [-0.10, 0.10]
wz = [-0.10, 0.10]
[families.disturbance]
start_s = 4.0
duration_s = 0.10
directions = ["+x", "-x", "+y", "-y"]
equivalent_delta_v = [0.05, 0.10, 0.15]

[[gates]]
id = "sequence_survival_lcb"
family = "sequence"
metric = "success"
statistic = "wilson_lower"
op = ">="
threshold = 0.90

[[gates]]
id = "sequence_recovery_lcb"
family = "sequence"
metric = "recovered"
statistic = "wilson_lower"
op = ">="
threshold = 0.85

[[gates]]
id = "sequence_target_arrival_lcb"
family = "sequence"
metric = "target_arrived"
statistic = "wilson_lower"
op = ">="
threshold = 0.50

[[gates]]
id = "sequence_final_target_error"
family = "sequence"
metric = "final_target_error"
statistic = "p95"
op = "<="
threshold = 0.10

[[gates]]
id = "sequence_post_target_speed"
family = "sequence"
metric = "post_target_speed_rms"
statistic = "p95"
op = "<="
threshold = 0.06

[[gates]]
id = "sequence_post_target_heading"
family = "sequence"
metric = "post_target_heading_error_rms"
statistic = "p95"
op = "<="
threshold = 0.15

[[gates]]
id = "sequence_stationary_tilt"
family = "sequence"
metric = "stationary_tilt_rms"
statistic = "p95"
op = "<="
threshold = 0.04

[[gates]]
id = "sequence_stationary_action_second_difference"
family = "sequence"
metric = "stationary_action_second_difference_rms"
statistic = "p95"
op = "<="
threshold = 0.18

[[gates]]
id = "sequence_stationary_body_rocking"
family = "sequence"
metric = "stationary_body_rocking_rms"
statistic = "p95"
op = "<="
threshold = 0.03
